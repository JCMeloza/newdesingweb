<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conquer Blocks</title>
    <script type="module" crossorigin src="/newdesingweb/assets/main-BcEPNGOD.js"></script>
    <link rel="stylesheet" crossorigin href="/newdesingweb/assets/main-wfGj8cb5.css">
  </head>
  <body>
   
    <main class="main-login">
      <section class="main-login__content">
        <div class="main-login__content-card">
          <div class="main-login__content-card-logo">
            <img
              src="/newdesingweb/assets/logo-eWjKbj44.png"
              alt="Logo Conquer"
              class="main-login__content-card-logo-img"
            />
          </div>
          <form class="main-login__content-card-form">
            <div class="main-login__content-card-form-group">
              <label
                for="email"
                class="main-login__content-card-form-group-label"
                >Email</label
              >
              <input
                type="email"
                id="email"
                class="main-login__content-card-form-group-input"
                placeholder="Ingresa tu email"
                required
              />
            </div>
            <div class="main-login__content-card-form-group">
              <label
                for="password"
                class="main-login__content-card-form-group-label"
                >Contraseña</label
              >
              <input
                type="password"
                id="password"
                class="main-login__content-card-form-group-input"
                placeholder="Ingresa tu contraseña"
                required
              />
            </div>
            <button
              type="submit"
              class="main-login__content-card-form-group-button"
            >
              Iniciar Sesión
            </button>
          </form>
          <div class="main-login__content-card-forget">
            <p>¿Olvidaste tu contraseña? <a href="#">Haz click aquí</a></p>
          </div>
        </div>
      </section>
    </main>
    <!-- footer ---------------------------------------------->

    <footer class="footer">
      <div class="footer-container">
        <div class="footer__logos">
          <a href="index.html"
            ><img
              class="footer__logos-img"
              src="/newdesingweb/assets/_logo-conquerblocks-footer-BrffDbrs.svg"
              alt="Logo Conquer Blocks"
          /></a>
          <div class="footer__logos-redes">
            <a href="#"
              ><span class="footer__logos-redes-icon facebook"></span
            ></a>
            <a href="#"
              ><span class="footer__logos-redes-icon tweeter"></span
            ></a>
            <a href="#"
              ><span class="footer__logos-redes-icon github"></span
            ></a>
          </div>
        </div>
        <div class="footer__links">
          <ul class="footer__links-list">
            <li class="footer__links-item">
              <a href="/about.html">Quienes Somos</a>
            </li>
            <li class="footer__links-item">
              <a href="/register.html">Registro</a>
            </li>
            <li class="footer__links-item">
              <a href="/login.html">Login</a>
            </li>
          </ul>
        </div>
      </div>
      <p>&copy; Conquer Blocks by @JCarlosMlg</p>
    </footer>
  </body>
</html>
